<mat-nav-list>
  @for (route of userRoles(); track route.key){
  <mat-list-item
    role="listitem"
    (click)="navigateTo($event, route.key)"
    matRipple
  >
    <mat-icon matListItemIcon [innerText]="route.icon"></mat-icon>
    <div matListItemTitle [innerText]="route.label"></div></mat-list-item
  >}
</mat-nav-list>
