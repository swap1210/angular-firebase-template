<app-header
  [title]="title"
  (sideNavToggleEventEmitter)="drawer.toggle()"
></app-header>
<mat-drawer-container [hasBackdrop]="true">
  <mat-drawer class="nav-drawer" #drawer mode="side">
    <mat-list role="list">
      <mat-list-item
        role="listitem"
        [routerLink]="[LOGIN_ROUTE]"
        routerLinkActive="router-link-active"
        matRipple
        >Login
      </mat-list-item>
      <mat-list-item
        role="listitem"
        [routerLink]="[REGISTER_ROUTE]"
        routerLinkActive="router-link-active"
        matRipple
        >Register
      </mat-list-item>
    </mat-list>
  </mat-drawer>
  <mat-drawer-content>
    <div class="main-flex">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
