<h1>
  Welcome {{ authService.userSignal()?.email }} to
  {{ SECURE_HOME_ROUTE_OBJ?.title }}!
</h1>
@if(tabs.length > 0) {
<mat-tab-group
  animationDuration="0ms"
  headerPosition="below"
  (selectedTabChange)="onTabSelected($event.index)"
>
  @for( tab of tabs; track tab.label ) {
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon class="tab-icon" [innerText]="tab.icon"></mat-icon>
      {{ tab.label }}</ng-template
    >
    <ng-template matTabContent #container></ng-template>
  </mat-tab>
  }
</mat-tab-group>
}
